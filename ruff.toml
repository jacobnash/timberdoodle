target-version = "py310"

# Ruff's own default rule set (E4, E7, E9, F, I as of ruff 0.16) is the
# baseline recorded in BASELINE.md (63 findings) - PLAN.md Stage 1.4
# adds BLE001 (blind except Exception) and RUF013 (implicit Optional)
# on top of it, both already fixed/noqa'd repo-wide. See PLAN.md
# Stage 3.3 for the broader --select ALL adoption decision.
[lint]
extend-select = ["BLE001", "RUF013"]

[lint.per-file-ignores]
# axon_convert.py's whole job is to emit Python source; the only way to
# test that the emitted source *behaves* like the Axon it came from is to
# exec() it. Test-only, hand-authored inputs - not user-supplied code
# (that path is sandbox.py, which carries its own scoped noqa).
"tests/test_axon_convert.py" = ["S102"]
