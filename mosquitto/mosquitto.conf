listener 1883

allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

# Default is 1000 - see docs-site/pages/multi-site.mdx's "MQTT has zero
# delivery guarantee today" for why that's cutting it close for a
# multi-point site queued during an outage.
max_queued_messages 10000
