[project]
name = "timberdoodle"
version = "0.1.0"
description = "Ontology-agnostic building data platform: API-first, load-time-pluggable (Brick/Haystack/DBO), headless by design"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0.0",
    "requests>=2.31.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "openapi-spec-validator>=0.7.0", "jsonschema>=4.0.0"]
llm = ["anthropic>=0.69.0", "pydantic>=2.0.0"]
validate = ["pyshacl>=0.30.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: requires live docker-compose services (oxigraph, postgres, mosquitto, jaeger)",
]
