# Demo-data pipeline: a simulated BACnet device (fbf.mock_device) plus
# FBF's own discovery/API service (fbf.api), so the public demo has real
# equipment/points/history to show instead of an empty app. Not part of
# timberdoodle's own core stack - a separate concern, kept in its own file.
#
# fbf.api discovers/polls fbf_mock_device over real BACnet/IP, which needs
# a fixed, known local address on both sides (bacpypes3 requires a literal
# IP, not a hostname) - a custom network with static IPs, rather than the
# default bridge's dynamic ones, gives it that. Confirmed working locally:
# BACnet unicast (not broadcast) crosses a normal Docker bridge network
# fine, no network_mode: host needed.
#
# fbf_api also joins the default network (no `networks:` override there)
# so it can reach `mosquitto` by service name, same as every other daemon.
#
# One-time provisioning (`python -m fbf.mock_hospital provision ...`,
# `timberdoodle.autotag`, `scripts/seed_derivations_and_faults.py`) is
# deliberately NOT run automatically on every deploy - see
# deploy/nash-srv/seed-demo-data.sh, run once by hand.
networks:
  bacnet-mock:
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  fbf_mock_device:
    build:
      context: fbf
      dockerfile: ../deploy/nash-srv/fbf.Dockerfile
    command: python -m fbf.mock_device --address 172.30.0.10/24:47808 --instance 3456 --site-spec /app/hospital_site_spec.json
    networks:
      bacnet-mock:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  fbf_api:
    build:
      context: fbf
      dockerfile: ../deploy/nash-srv/fbf.Dockerfile
    command: >
      python -m fbf.api
      --address 172.30.0.11/24:47820 --host 0.0.0.0 --port 8001
      --mqtt-host mosquitto --mqtt-port 1883
      --mqtt-username timberdoodle --mqtt-password ${MQTT_PASSWORD:?set in nash-srv.env}
      --state-file /app/state/fbf-connections.json
      --devices-state-file /app/state/fbf-devices.json
      --modbus-state-file /app/state/fbf-modbus-connections.json
    networks:
      bacnet-mock:
        ipv4_address: 172.30.0.11
      default:
    volumes:
      - fbf-state:/app/state
    restart: unless-stopped
    depends_on:
      - fbf_mock_device

volumes:
  fbf-state:
