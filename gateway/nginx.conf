load_module modules/ngx_http_js_module.so;

# main context only - http{} rejects this directive.
env TIMBERDOODLE_JWT_SECRET;
env TIMBERDOODLE_GATEWAY_SECRET;

# Default level is "error" - ngx.log(ngx.WARN/INFO, ...) calls from
# gateway/njs/main.js (revocation-cache refresh outcomes) would be
# silently dropped without this.
error_log /dev/stderr warn;

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Without this, nginx's default_type (text/plain) applies to every
    # static file /ui/ serves - Chrome silently refuses to apply a
    # stylesheet served as text/plain (strict MIME checking for CSS), so
    # every page under /ui/ rendered completely unstyled. Discovered
    # live verifying the alarms/derivations UI pages in a real browser -
    # ships with nginx:alpine at this exact path, just never included.
    include mime.types;

    # njs gateway-enforced auth (see gateway/njs/ and the plan doc's
    # Phase 2). Landed here as pure infra first - no location below is
    # wired to `js_access main.authorize;` yet. That happens location by
    # location in later commits; until then this block is inert.

    # Required for ngx.fetch() (main.refreshRevoked's call to auth_api)
    # to resolve container hostnames at all - unlike proxy_pass, which
    # resolves once at nginx startup and needs no resolver, ngx.fetch()
    # does its own DNS lookup per call and errors with "no resolver
    # defined" without this. 127.0.0.11 is Docker Compose's embedded
    # per-project DNS server.
    resolver 127.0.0.11 valid=10s;

    js_path "njs/";
    js_import main from njs/main.js;

    js_shared_dict_zone zone=revoked:1m timeout=120s;              # jti denylist cache, refreshed by js_periodic below
    js_shared_dict_zone zone=ratelimit:10m type=number timeout=60s; # per-token request counters - timeout= is required for .incr()'s own TTL argument to work at all

    js_var $user;             # set by main.authorize(), forwarded as X-User (logging/tracing only)
    js_var $gateway_secret;   # set by main.authorize(), forwarded as X-Gateway-Secret (backend defense-in-depth)

    # Brute-force throttling for /auth/login specifically - plain nginx,
    # no njs needed (that route can't require a JWT to get a JWT).
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Same idea for /auth/orgs - it's the other route policy.js marks
    # public (a brand-new org has to be creatable with no prior
    # credentials), so it's the other place per-IP abuse throttling
    # matters more than it does for a plain unauthenticated GET.
    limit_req_zone $binary_remote_addr zone=signup:10m rate=5r/m;
    limit_req_status 429; # default is 503, which reads as "the server is down", not "slow down"

    server {
        listen 80;

        # nginx only ever sees plain HTTP here (Caddy terminates TLS and
        # proxies to it over HTTP) - nginx's default absolute_redirect on
        # would build this and every other relative Location using
        # $scheme, which is "http" from nginx's point of view even when
        # the actual visitor is on https://. off makes it emit the bare
        # path instead, so the browser keeps whatever scheme it's already
        # using instead of getting redirected down to plain HTTP.
        absolute_redirect off;

        location = / {
            return 302 /ui/;
        }

        # js_periodic needs *a* location to be declared in but doesn't
        # need real traffic there - /ui/ is already unauthenticated, so
        # it's a reasonable place to hang this rather than inventing an
        # empty one. Refreshes ngx.shared.revoked from auth_api every 30s.
        location /ui/ {
            js_periodic main.refreshRevoked interval=30s;
            alias /usr/share/nginx/ui/;
            index index.html;
        }

        # ponytail: proxy_pass targets resolve once at nginx startup and
        # stay cached - if a single backend service is recreated on its own
        # (not the whole stack), restart this gateway too so it picks up
        # the new address. Dynamic re-resolution (resolver + variable
        # proxy_pass) is the fix if that independent-restart case becomes
        # routine rather than rare.

        # Cut over to gateway-enforced auth (Phase 2 migration path, step
        # 6, the last of the four - htpasswd is fully retired now that
        # this one's done).
        location /ingest/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://ingest_api:8000/;
        }

        # Cut over to gateway-enforced auth (Phase 2 migration path, step 5).
        location /fault/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://fault_api:8002/;
        }

        # Cut over to gateway-enforced auth (Phase 2 migration path, step 4).
        location /derivation/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://derivation_api:8003/;
        }

        # Cut over to gateway-enforced auth (Phase 2 migration path,
        # step 3 - smallest/newest/lowest-traffic surface, first to move).
        location /validate/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://validate_api:8005/;
        }

        location /ops/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://ops_api:8007/;
        }

        # auth_api is new - no legacy htpasswd behavior to preserve, so
        # it goes straight to js_access from day one.

        # Exact match wins over the /auth/ prefix location below
        # regardless of declaration order - login can't require a JWT to
        # get a JWT, so no js_access here, just brute-force throttling.
        location = /auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://auth_api:8006/login;
        }

        # Also public (policy.js: POST /auth/orgs has minRole null), but
        # unlike login it still runs through js_access - that's what
        # actually executes the "this route is public" branch in
        # main.authorize() rather than skipping the policy table
        # entirely the way login's own bypass does.
        location = /auth/orgs {
            limit_req zone=signup burst=5 nodelay;
            js_access main.authorize;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://auth_api:8006/orgs;
        }

        location /auth/ {
            js_access main.authorize;
            proxy_set_header X-User $user;
            proxy_set_header X-Gateway-Secret $gateway_secret;
            proxy_pass http://auth_api:8006/;
        }
    }
}
