name: Deploy

# Fires only after the CI workflow finishes on main, and only deploys if it
# passed - a broken build never reaches nash-srv. See
# docs-site/pages/nash-srv-deploy.mdx for the full setup this depends on
# (self-hosted runner, deploy wrapper, Caddy, DNS).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual redeploy (Actions -> Deploy -> Run workflow) - e.g. after
  # re-running setup-runner.sh on the box to pick up a wrapper change,
  # without needing a throwaway commit just to trigger a fresh run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, nash-srv, timberdoodle]
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated, not just "main" (which
          # may have moved on again by the time this job starts) - falls
          # back to the dispatch event's own sha when triggered manually
          # (workflow_run.head_sha doesn't exist on that event).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # fbf/ is a submodule pointing at a separate private repo, cloned
          # in its own step below instead of via submodules: true here.
          # checkout temporarily sets a *global* git url.insteadOf rule
          # (SSH -> HTTPS, using its own token) for the whole duration of
          # this step, including any submodule clone that would happen
          # inside it - that hijacks the fbf submodule's SSH URL before the
          # runner's own SSH deploy key for it ever gets a chance, failing
          # with "repository not found" (confirmed live; persist-credentials:
          # false does NOT help - it only controls cleanup afterward, not
          # what's active during this step). Letting checkout finish first
          # means its temporary config is already removed by the time the
          # next step clones fbf, so the deploy key works as configured.

      - name: Checkout fbf submodule
        run: git submodule update --init

      - name: Deploy stack
        # The only command this runner user can run as root - see
        # deploy/nash-srv/setup-runner.sh. Rebuilds/recreates containers and
        # restarts gateway; postgres-data/oxigraph-data volumes are untouched.
        run: sudo /usr/local/sbin/timberdoodle-deploy.sh

      - name: Seed demo account if needed
        # Deploy stack (above) already blocks until gateway responds again
        # after its post-restart - nothing left to race here, just a
        # single login check.
        env:
          DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${DEMO_ADMIN_EMAIL}\",\"password\":\"${DEMO_ADMIN_PASSWORD}\"}")
          if [ "$code" != "200" ]; then
            # POST /auth/orgs is not safe to call twice for the same email
            # (leaves an orphan org row and 500s - see auth.py), so this
            # only ever runs the very first time the demo account is missing.
            echo "demo account doesn't exist yet (login returned $code) - creating it"
            curl -sf -X POST http://127.0.0.1:8080/auth/orgs \
              -H 'Content-Type: application/json' \
              -d "{\"name\":\"Demo\",\"admin_email\":\"${DEMO_ADMIN_EMAIL}\",\"admin_password\":\"${DEMO_ADMIN_PASSWORD}\"}"
          fi

      - name: Build and publish docs
        run: |
          cd docs-site
          npm ci
          npm run build
          cp -r dist/. /var/www/timberdoodle-docs/
