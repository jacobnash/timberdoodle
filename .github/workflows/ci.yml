name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,validate]"
      - run: pytest -m "not integration"
      - run: openapi-spec-validator openapi.yaml fault-api-openapi.yaml derivation-api-openapi.yaml validate-api-openapi.yaml auth-api-openapi.yaml
      # ruff is still non-blocking (PLAN.md Stage 0.2) - baseline was 63,
      # down to a handful of findings in files with in-flight feature
      # work as of BASELINE.md's last update. Flip to blocking once it
      # hits 0. mypy reached a genuine, permanent 0 (BASELINE.md) - blocking.
      - run: ruff check src/ tests/
        continue-on-error: true
      - run: mypy src/timberdoodle
      # Clone-detection is reporting-only (PLAN.md Guardrails) - alerts on
      # new duplication without blocking; baseline is ~3.7% Python
      # (BASELINE.md). Node is preinstalled on GitHub Actions runners.
      - run: npx --yes jscpd@4 src/timberdoodle tests ui gateway/njs --min-lines 5 --min-tokens 40 --ignore "**/__pycache__/**"
        continue-on-error: true
      # gateway/njs/ has no pytest equivalent - plain node runs the same
      # WebCrypto-based logic njs runs inside nginx (GitHub Actions
      # runners have Node preinstalled, no setup-node action needed).
      - run: node gateway/njs/test_jwt.mjs && node gateway/njs/test_policy.mjs

  integration:
    runs-on: ubuntu-latest
    # Job-level so every docker-compose step (up, ps, logs) can interpolate
    # them, not just `up`. These are throwaway CI-only values so the stack can
    # start at all (auth_api/gateway refuse to start without the two secrets;
    # mosquitto and every MQTT daemon refuse to start without MQTT_PASSWORD)
    # and tests/test_gateway_auth.py has a real gateway to test against - never
    # real secrets, never committed. TIMBERDOODLE_ALLOW_PRIVATE_WEBHOOKS lets
    # the webhook e2e tests register/deliver to their on-host receiver.
    env:
      TIMBERDOODLE_JWT_SECRET: ci-only-jwt-secret-needs-32-bytes-minimum
      TIMBERDOODLE_GATEWAY_SECRET: ci-only-gateway-secret-value
      MQTT_PASSWORD: ci-only-mqtt-password
      TIMBERDOODLE_ALLOW_PRIVATE_WEBHOOKS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,validate]"
      - run: docker compose up -d --build
      - name: Wait for postgres to be healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker compose ps postgres --format json | python3 -c "import json,sys; print(json.load(sys.stdin).get('Health',''))")
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "postgres never became healthy" >&2
          docker compose logs
          exit 1
      # Coverage is reporting-only for now (PLAN.md Stage 0.2/Guardrails) -
      # baseline is 81% (BASELINE.md). No --cov-fail-under yet: the floor
      # should ratchet up from a real baseline, not block on day one.
      - run: pytest -m "integration or not integration" --cov=timberdoodle --cov-report=term-missing
      - if: always()
        run: docker compose logs
