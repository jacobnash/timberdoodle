x-daemon-env: &daemon-env
  TIMBERDOODLE_PG_DSN: postgresql://timberdoodle:${POSTGRES_PASSWORD:-timberdoodle}@postgres:5432/timberdoodle
  OXIGRAPH_URL: http://oxigraph:7878
  MQTT_HOST: mosquitto
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

x-daemon-depends-on: &daemon-depends-on
  postgres:
    condition: service_healthy
  oxigraph:
    condition: service_started
  mosquitto:
    condition: service_started

services:
  mosquitto:
    image: eclipse-mosquitto:2
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    command: serve -l /data -b 0.0.0.0:7878 --cors --union-default-graph
    volumes:
      - oxigraph-data:/data
    ports:
      - "7878:7878"

  postgres:
    image: timescale/timescaledb:latest-pg16
    command: postgres -c log_statement=all
    environment:
      POSTGRES_USER: timberdoodle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timberdoodle}
      POSTGRES_DB: timberdoodle
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timberdoodle"]
      interval: 2s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP HTTP

  grafana:
    image: grafana/grafana-oss:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3033:3000"

  mqtt_listener:
    build: .
    command: python -m timberdoodle.mqtt_listener
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on

  ingest_api:
    build: .
    command: python -m timberdoodle.ingest_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on

  fault_api:
    build: .
    command: python -m timberdoodle.fault_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on

  fault_detector:
    build: .
    command: python -m timberdoodle.fault_detector
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on

  derivation_api:
    build: .
    command: python -m timberdoodle.derivation_api
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on

  derivation_engine:
    build: .
    command: python -m timberdoodle.derivation_engine
    environment: *daemon-env
    volumes:
      - .:/app
    depends_on: *daemon-depends-on

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/read.htpasswd:/etc/nginx/read.htpasswd:ro
      - ./gateway/write.htpasswd:/etc/nginx/write.htpasswd:ro
      - ./ui:/usr/share/nginx/ui:ro
    depends_on:
      - ingest_api
      - fault_api
      - derivation_api

volumes:
  oxigraph-data:
  postgres-data:
  grafana-data:
